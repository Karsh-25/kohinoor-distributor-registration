<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kohinoor — Distributor Registration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2B22;
    --deep-green:#173A2C;
    --sage-bg:#EEF2EA;
    --card:#FFFFFF;
    --gold:#B4863A;
    --gold-soft:#E7D5AF;
    --line:#DCE3D8;
    --error:#B3402F;
    --success:#3E7150;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--sage-bg);
    background-image: radial-gradient(circle at 12% 8%, #E4EBE0 0%, var(--sage-bg) 45%);
    font-family:'Work Sans', sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:48px 16px;
  }
  .wrap{
    width:100%;
    max-width:480px;
  }
  .brandmark{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:22px;
  }
  .brandmark .seal{
    width:36px;height:36px;border-radius:50%;
    background:var(--deep-green);
    display:flex;align-items:center;justify-content:center;
    color:var(--gold-soft);
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:17px;
    flex-shrink:0;
  }
  .brandmark .name{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:20px;
    letter-spacing:0.02em;
    color:var(--deep-green);
  }
  .brandmark .name span{
    display:block;
    font-family:'Work Sans', sans-serif;
    font-weight:500;
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--gold);
    margin-top:1px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:34px 30px 28px;
    box-shadow:0 1px 2px rgba(23,58,44,0.04), 0 12px 32px -18px rgba(23,58,44,0.25);
  }
  .card h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:24px;
    margin:0 0 4px;
    color:var(--deep-green);
  }
  .card p.sub{
    margin:0 0 26px;
    font-size:13.5px;
    color:#5A6B5E;
  }
  .field{
    margin-bottom:16px;
    position:relative;
  }
  .field label{
    display:block;
    font-size:12.5px;
    font-weight:600;
    letter-spacing:0.02em;
    color:var(--deep-green);
    margin-bottom:6px;
  }
  .field input, .field select{
    width:100%;
    padding:11px 13px;
    font-size:14.5px;
    font-family:'Work Sans', sans-serif;
    border:1px solid var(--line);
    border-radius:9px;
    background:#FCFDFB;
    color:var(--ink);
    outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
    appearance:none;
    -webkit-appearance:none;
  }
  .field select{
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9'><path d='M1 1l6 6 6-6' stroke='%23173A2C' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat:no-repeat;
    background-position:right 13px center;
    padding-right:34px;
  }
  .field input:focus, .field select:focus{
    border-color:var(--gold);
    box-shadow:0 0 0 3px rgba(180,134,58,0.15);
  }
  .field input.invalid, .field select.invalid{
    border-color:var(--error);
  }
  .employee-feedback{
    margin-top:7px;
    font-size:12.5px;
    display:none;
    align-items:flex-start;
    gap:6px;
  }
  .employee-feedback.show{display:flex;}
  .employee-feedback.found{color:var(--success);}
  .employee-feedback.notfound{color:var(--error);}
  .employee-feedback .dot{
    width:6px;height:6px;border-radius:50%;
    background:currentColor;
    flex-shrink:0;
    margin-top:5px;
  }
  .employee-feedback .body{flex:1;min-width:0;}
  .emp-summary{line-height:1.4;}
  .emp-sales{
    color:var(--gold);
    font-weight:600;
  }
  .emp-members{
    list-style:none;
    margin:6px 0 0;
    padding:0;
    border-left:2px solid var(--gold-soft);
  }
  .emp-members li{
    padding:2px 0 2px 12px;
    font-size:12px;
    color:#5A6B5E;
  }
  .row2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .terms{
    display:flex;
    gap:9px;
    align-items:flex-start;
    margin:20px 0 22px;
    font-size:12.5px;
    color:#5A6B5E;
    line-height:1.5;
  }
  .terms input{margin-top:2px;flex-shrink:0;}
  .terms a{color:var(--deep-green);font-weight:600;text-decoration:none;border-bottom:1px solid var(--gold-soft);}
  button.submit{
    width:100%;
    padding:13px;
    background:var(--deep-green);
    color:#F5F1E4;
    border:none;
    border-radius:9px;
    font-family:'Work Sans', sans-serif;
    font-size:15px;
    font-weight:600;
    letter-spacing:0.02em;
    cursor:pointer;
    transition:background .15s ease, transform .1s ease;
  }
  button.submit:hover{background:#0F2D21;}
  button.submit:active{transform:scale(0.99);}
  button.submit:disabled{opacity:0.6;cursor:not-allowed;}
  .msg{
    margin-top:14px;
    font-size:13px;
    text-align:center;
    padding:10px;
    border-radius:8px;
    display:none;
  }
  .msg.show{display:block;}
  .msg.error{background:#FBEAE7;color:var(--error);}
  .msg.success{background:#E7F0E9;color:var(--success);}
  .footlinks{
    text-align:center;
    margin-top:20px;
    font-size:12.5px;
    color:#5A6B5E;
  }
  .footlinks a{color:var(--deep-green);text-decoration:none;font-weight:600;}
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="brandmark">
    <div class="seal">K</div>
    <div class="name">Kohinoor<span>Employee Registration</span></div>
  </div>

  <div class="card">
    <h1>Registration</h1>
    <p class="sub">Enter your Employee ID to get started.</p>

    <form id="regForm" novalidate>
      <div class="field">
        <label for="EmployeeId">Employee ID</label>
        <input type="text" id="EmployeeId" autocomplete="off" placeholder="Employee ID" required>
        <div class="employee-feedback" id="EmployeeFeedback"><span class="dot"></span><span class="body" id="EmployeeFeedbackText"></span></div>
      </div>

      <div class="field">
        <label for="jobPosition">Position</label>
        <select id="jobPosition" required>
          <option value="" disabled selected>Select your position</option>
          <option value="Sales Manager">Sales Manager</option>
          <option value="Area Business Manager">Area Business Manager</option>
          <option value="Sales Associate">Sales Associate</option>
          <option value="Branch Manager">Branch Manager</option>
          <option value="Distributor">Distributor</option>
        </select>
      </div>

      <div class="field">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" placeholder="Full Name" required>
      </div>

      <div class="row2">
        <div class="field">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" autocomplete="off" maxlength="13" placeholder="Phone Number" required>
        </div>
        <div class="field">
          <label for="gender">Gender</label>
          <select id="gender" required>
            <option value="" disabled selected>Select</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Email id" required>
      </div>

      <div class="row2">
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter Password" required minlength="6">
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" required minlength="6">
        </div>
      </div>

      <label class="terms">
        <input type="checkbox" id="acceptTerms" required>
        <span>I accept the <a href="#">Terms of Use</a> and <a href="#">Privacy Policy</a></span>
      </label>

      <button type="submit" class="submit" id="submitBtn">Register</button>
      <div class="msg" id="formMsg"></div>
    </form>

    
  </div>
</div>

<script>
  // ---- IMPORTANT: paste your deployed Google Apps Script Web App URL here ----
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzTNibxpkZwxw_DUjVcq4F7pPJuM9iV_BnEBu5rJKVPsQ_VpyT8jqwNQH15LrUG29p9/exec";

  // ---- Employee ID -> name / position / state / sales lookup ----
  // The employee list now lives in the "Employees" sheet tab and is
  // fetched live from Code.gs — nothing to keep in sync here anymore.

  const employeeInput = document.getElementById('EmployeeId');
  const feedback = document.getElementById('EmployeeFeedback');
  const feedbackText = document.getElementById('EmployeeFeedbackText');

  let matchedEmployeeName = "";
  let lookupTimer = null;
  let lookupSeq = 0; // guards against an older, slower response landing after a newer one

  function escapeHtml(s){
    return String(s)
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;');
  }

  function renderEmployeeFound(data){
    let html =
      '<div class="emp-summary">' +
        escapeHtml(data.name) + ' (' + escapeHtml(data.position) + ') — ' + escapeHtml(data.state) +
        ' <span class="emp-sales">· Sale — ' + data.totalSales + '</span>' +
      '</div>';

    if(data.members && data.members.length){
      html += '<ul class="emp-members">';
      data.members.forEach(function(m){
        const label = m.position ? (m.name + ' — ' + m.position) : m.name;
        html += '<li>' + escapeHtml(label) + '</li>';
      });
      html += '</ul>';
    }

    feedbackText.innerHTML = html;
  }

  function checkEmployeeId(){
    const code = employeeInput.value.trim().toUpperCase();

    clearTimeout(lookupTimer);

    if(!code){
      feedback.classList.remove('show','found','notfound');
      matchedEmployeeName = "";
      return;
    }

    const thisSeq = ++lookupSeq;

    lookupTimer = setTimeout(function(){
      fetch(SCRIPT_URL + "?action=lookup&code=" + encodeURIComponent(code))
        .then(function(res){ return res.json(); })
        .then(function(data){
          if(thisSeq !== lookupSeq) return; // a newer keystroke already superseded this

          if(data.found){
            matchedEmployeeName = data.name;
            renderEmployeeFound(data);
            feedback.classList.add('show','found');
            feedback.classList.remove('notfound');
            employeeInput.classList.remove('invalid');
          } else {
            matchedEmployeeName = "";
            feedbackText.textContent = "Code not recognized";
            feedback.classList.add('show','notfound');
            feedback.classList.remove('found');
          }
        })
        .catch(function(){
          if(thisSeq !== lookupSeq) return;
          matchedEmployeeName = "";
          feedbackText.textContent = "Couldn't verify code — check your connection";
          feedback.classList.add('show','notfound');
          feedback.classList.remove('found');
        });
    }, 300);
  }
  employeeInput.addEventListener('input', checkEmployeeId);

  const jobPositionSelectEl = document.getElementById('jobPosition');
  jobPositionSelectEl.addEventListener('change', function(){
    jobPositionSelectEl.classList.remove('invalid');
  });

  // ---- Phone validation ----
  // Accepts: 10-digit starting 6-9, optionally prefixed with +91 / 91 / 0
  function normalizePhone(value){
    const m = value.trim().replace(/[\s-]/g,'').match(/^(?:\+91|91|0)?([6-9]\d{9})$/);
    return m ? m[1] : null;
  }

  // ---- Form submit ----
  const form = document.getElementById('regForm');
  const msg = document.getElementById('formMsg');
  const submitBtn = document.getElementById('submitBtn');
  const phoneInput = document.getElementById('phone');
  const jobPositionSelect = document.getElementById('jobPosition');

form.addEventListener('submit', function(e){
  e.preventDefault();

  msg.classList.remove('show','error','success');
  phoneInput.classList.remove('invalid');
  employeeInput.classList.remove('invalid');
  jobPositionSelect.classList.remove('invalid');

  const code = employeeInput.value.trim().toUpperCase();
  const jobPosition = jobPositionSelect.value;

  const fullName = document.getElementById('fullName').value.trim();
  const phone = normalizePhone(phoneInput.value);
  const gender = document.getElementById('gender').value;
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const confirmPassword = document.getElementById('confirmPassword').value;
  const termsAccepted = document.getElementById('acceptTerms').checked;


  // Employee ID — matchedEmployeeName is only set once the live lookup
  // confirms the code, so this also catches "submitted before the
  // 300ms lookup finished".
  if(!code || !matchedEmployeeName){
    msg.textContent = "Please enter a valid Employee ID and wait for it to be verified.";
    msg.classList.add('show','error');
    employeeInput.classList.add('invalid');
    return;
  }


  // Position
  if(!jobPosition){
    msg.textContent = "Please select your position.";
    msg.classList.add('show','error');
    jobPositionSelect.classList.add('invalid');
    return;
  }


  // Full Name
  if(!fullName){
    msg.textContent = "Please enter your full name.";
    msg.classList.add('show','error');
    return;
  }


  // Phone
  if(!phone){
    msg.textContent = "Enter a valid 10-digit Indian mobile number.";
    msg.classList.add('show','error');
    phoneInput.classList.add('invalid');
    return;
  }


  // Gender
  if(!gender){
    msg.textContent = "Please select your gender.";
    msg.classList.add('show','error');
    return;
  }


  // Email
  if(!email){
    msg.textContent = "Please enter your email address.";
    msg.classList.add('show','error');
    return;
  }

  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    msg.textContent = "Please enter a valid email address.";
    msg.classList.add('show','error');
    return;
  }


  // Password
  if(!password){
    msg.textContent = "Please enter a password.";
    msg.classList.add('show','error');
    return;
  }

  if(password.length < 6){
    msg.textContent = "Password must be at least 6 characters.";
    msg.classList.add('show','error');
    return;
  }


  // Confirm Password
  if(!confirmPassword){
    msg.textContent = "Please confirm your password.";
    msg.classList.add('show','error');
    return;
  }

  if(password !== confirmPassword){
    msg.textContent = "Passwords do not match.";
    msg.classList.add('show','error');
    return;
  }


  // Terms
  if(!termsAccepted){
    msg.textContent = "Please accept the Terms of Use and Privacy Policy.";
    msg.classList.add('show','error');
    return;
  }


  // Payload
  const payload = {
    EmployeeId: code,
    EmployeeName: matchedEmployeeName,
    position: jobPosition,
    fullName: fullName,
    phone: phone,
    gender: gender,
    email: email,
    password: password
  };


  submitBtn.disabled = true;
  submitBtn.textContent = "Submitting...";


  fetch(SCRIPT_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'text/plain;charset=utf-8'
    },
    body: JSON.stringify(payload)
  })
  .then(function(res){
    return res.json();
  })
  .then(function(result){

    submitBtn.disabled = false;
    submitBtn.textContent = "Register";

    if(result.result === 'success'){

      msg.textContent =
        result.message ||
        ("Registration successful! Welcome, " + payload.fullName + ".");

      msg.classList.add('show','success');

      form.reset();
      feedback.classList.remove('show');

    } else {

      msg.textContent =
        result.message ||
        "Something went wrong. Please try again.";

      msg.classList.add('show','error');
    }

  })
  .catch(function(){

    submitBtn.disabled = false;
    submitBtn.textContent = "Register";

    msg.textContent = "Something went wrong. Please try again.";
    msg.classList.add('show','error');

  });
});
</script>
</body>
</html>
